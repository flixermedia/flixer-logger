name: Publish Logger image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve release version
        id: version
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < internal/httpapi/VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must contain a stable X.Y.Z version." >&2
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag does not match VERSION." >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null 2>&1; then
            new_release=false
          else
            new_release=true
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "new_release=$new_release" >> "$GITHUB_OUTPUT"
      - name: Smoke test container ownership and readiness
        shell: bash
        run: |
          docker build --build-arg APP_VERSION="${{ steps.version.outputs.version }}" -t flixer-logger-smoke:ci .
          for uid in 65531 1000; do
            name="flixer-logger-smoke-$uid"
            trap 'docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
            docker run -d --name "$name" --user "$uid:$uid" \
              --tmpfs "/data/logs/logger:uid=$uid,gid=$uid,mode=0700" \
              --tmpfs "/run/flixer-logger:uid=$uid,gid=$uid,mode=0700" \
              flixer-logger-smoke:ci --data-dir /data --listen 127.0.0.1:8098 \
              --bootstrap-owner-file /run/flixer-logger/owner
            ready=false
            for attempt in {1..30}; do
              if docker exec "$name" wget -q -O /dev/null http://127.0.0.1:8098/api/health/ready; then
                ready=true
                break
              fi
              sleep 1
            done
            if [ "$ready" != true ]; then
              docker logs "$name"
              exit 1
            fi
            docker rm -f "$name" >/dev/null
            trap - EXIT
          done
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ steps.version.outputs.new_release == 'true' || github.ref_type == 'tag' }}
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
      - name: Create tag and GitHub Release
        if: steps.version.outputs.new_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
